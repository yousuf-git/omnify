<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Omnify logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B2A4A"/>
      <stop offset="1" stop-color="#0A1226"/>
    </linearGradient>
    <linearGradient id="top" x1="80" y1="34" x2="80" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A29BFF"/>
      <stop offset="1" stop-color="#635BFF"/>
    </linearGradient>
    <linearGradient id="left" x1="34" y1="60" x2="80" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5A52F0"/>
      <stop offset="1" stop-color="#3E37B8"/>
    </linearGradient>
    <linearGradient id="right" x1="126" y1="60" x2="80" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4840D6"/>
      <stop offset="1" stop-color="#2A2596"/>
    </linearGradient>
    <linearGradient id="sheen" x1="46" y1="40" x2="80" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#635BFF" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- rounded app-icon backdrop -->
  <rect x="2" y="2" width="156" height="156" rx="38" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="155" height="155" rx="37.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- isometric crate (inventory box) -->
  <g filter="url(#soft)">
    <!-- top face -->
    <path d="M80 34 L126 60 L80 86 L34 60 Z" fill="url(#top)"/>
    <!-- left face -->
    <path d="M34 60 L80 86 L80 128 L34 102 Z" fill="url(#left)"/>
    <!-- right face -->
    <path d="M126 60 L80 86 L80 128 L126 102 Z" fill="url(#right)"/>
    <!-- top sheen -->
    <path d="M80 34 L126 60 L80 86 L34 60 Z" fill="url(#sheen)"/>
  </g>

  <!-- packing-tape seam across the lid -->
  <path d="M34 60 L80 86 L126 60" fill="none" stroke="#0A1226" stroke-opacity="0.28" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M80 86 L80 128" stroke="#0A1226" stroke-opacity="0.22" stroke-width="2.5"/>

  <!-- 'O' aperture stamped on the front-right panel -->
  <ellipse cx="103" cy="88" rx="9" ry="13" fill="none" stroke="#C9C5FF" stroke-opacity="0.85" stroke-width="3.4"/>

  <!-- stock-level ticks on the left panel -->
  <path d="M45 74 L57 81" stroke="#BFB9FF" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round"/>
  <path d="M45 86 L57 93" stroke="#BFB9FF" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
</svg>
