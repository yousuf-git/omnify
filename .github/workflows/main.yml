name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          # SSM AWS-RunShellScript runs as root; run the deploy as the app user
          # (ubuntu) via a login shell so ~, nvm and pm2 resolve.
          cat > ssm-params.json <<'JSON'
          {
            "commands": [
              "set -e",
              "runuser -l ubuntu -c 'export NVM_DIR=\"$HOME/.nvm\"; . \"$NVM_DIR/nvm.sh\"; cd ~/omnify/api && git pull origin main && npm ci --omit=dev && pm2 restart omnify-api --update-env && pm2 save'"
            ]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Never abort here — we want the on-box logs even when the script fails.
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" || true

          INV=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}")

          echo "--- stdout ---"
          echo "$INV" | jq -r '.StandardOutputContent'
          echo "--- stderr ---"
          echo "$INV" | jq -r '.StandardErrorContent'

          STATUS=$(echo "$INV" | jq -r '.Status')
          echo "Status: $STATUS"
          [ "$STATUS" = "Success" ]
